<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Semanal</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="agenda-box">
        <div class="card" data-dia="segunda">
            <div class="titlecard">
                <h2>Segunda-feira</h2>
            </div>
            <div class="toggle-icons">
                <img src="css.gg/chevron-double-down-r.svg" class="abrir" />
                <img src="css.gg/chevron-double-up-r.svg" class="fechar hidden" />
            </div>
            <div class="tarefas hidden">
                <ul class="lista-tarefas"></ul>
                <input type="text" placeholder="Nova tarefa..." class="input-tarefa" />
                <button class="add-tarefa">Adicionar</button>
            </div>
        </div>
        <div class="card" data-dia="terca">
            <div class="titlecard">
                <h2>Terça-feira</h2>
            </div>
            <div class="toggle-icons">
                <img src="css.gg/chevron-double-down-r.svg" class="abrir" />
                <img src="css.gg/chevron-double-up-r.svg" class="fechar hidden" />
              </div>
            <div class="tarefas hidden">
                <ul class="lista-tarefas"></ul>
                <input type="text" placeholder="Nova tarefa..." class="input-tarefa" />
                <button class="add-tarefa">Adicionar</button>
            </div>
        </div>
        <div class="card" data-dia="quarta">
            <div class="titlecard">
                <h2>Quarta-feira</h2>
            </div>
            <div class="toggle-icons">
                <img src="css.gg/chevron-double-down-r.svg" class="abrir" />
                <img src="css.gg/chevron-double-up-r.svg" class="fechar hidden" />
              </div>
            <div class="tarefas hidden">
                <ul class="lista-tarefas"></ul>
                <input type="text" placeholder="Nova tarefa..." class="input-tarefa" />
                <button class="add-tarefa">Adicionar</button>
            </div>
        </div>
        <div class="card" data-dia="quinta">
            <div class="titlecard">
                <h2>Quinta-feira</h2>
            </div>
            <div class="toggle-icons">
                <img src="css.gg/chevron-double-down-r.svg" class="abrir" />
                <img src="css.gg/chevron-double-up-r.svg" class="fechar hidden" />
              </div>
            <div class="tarefas hidden">
                <ul class="lista-tarefas"></ul>
                <input type="text" placeholder="Nova tarefa..." class="input-tarefa" />
                <button class="add-tarefa">Adicionar</button>
            </div>
        </div>
        <div class="card" data-dia="sexta">
            <div class="titlecard">
                <h2>Sexta-Feira</h2>
            </div>
            <div class="toggle-icons">
                <img src="css.gg/chevron-double-down-r.svg" class="abrir" />
                <img src="css.gg/chevron-double-up-r.svg" class="fechar hidden" />
              </div>
            <div class="tarefas hidden">
                <ul class="lista-tarefas"></ul>
                <input type="text" placeholder="Nova tarefa..." class="input-tarefa" />
                <button class="add-tarefa">Adicionar</button>
            </div>
        </div>

    </div>

    <!-- Repita os cards para os outros dias -->
    </div>

    <script src="script.js"></script>
</body>

</html>
